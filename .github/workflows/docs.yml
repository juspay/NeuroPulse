name: Documentation

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'src/**/*.ts'
      - '.github/workflows/docs.yml'
      - 'mkdocs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'src/**/*.ts'
      - 'mkdocs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Markdown
        uses: DavidAnson/markdownlint-cli2-action@v13
        with:
          globs: |
            **/*.md
            !node_modules/**/*.md
            !dist/**/*.md

      - name: Check Links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: '.github/mlc_config.json'
        continue-on-error: true

      - name: Validate API Documentation
        run: |
          if [ -f "docs/API.md" ]; then
            echo "✅ API documentation found"
            # Add specific API doc validation if needed
          else
            echo "⚠️  API documentation not found"
          fi

  build-docs:
    runs-on: ubuntu-latest
    needs: validate-docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin

      - name: Generate TypeScript Documentation
        run: |
          npx typedoc --out docs/api src/
        continue-on-error: true

      - name: Build MkDocs site
        run: |
          if [ -f "mkdocs.yml" ]; then
            mkdocs build --clean --strict
          else
            echo "No mkdocs.yml found, creating basic documentation structure"
            mkdir -p site
            cp README.md site/index.html || echo "<h1>NeuroPulse Documentation</h1>" > site/index.html
            cp -r docs/* site/ 2>/dev/null || echo "No docs directory found"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: ./site

  deploy-docs:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3

  api-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate API Documentation
        run: |
          echo "🔍 Analyzing API endpoints..."
          # Extract API routes from source code
          grep -r "app\.\(get\|post\|put\|delete\|patch\)" src/ || echo "No Express routes found"
          
          echo "📊 Generating service documentation..."
          # Document service methods
          find src/services -name "*.ts" -exec echo "Service: {}" \;

      - name: Update API Documentation
        if: github.ref == 'refs/heads/main'
        run: |
          echo "📝 Updating API documentation..."
          cat > docs/API.md << 'EOF'
          # NeuroPulse API Documentation

          ## Overview
          This document describes the API endpoints and services available in the NeuroPulse application.

          ## Services

          ### Daily Summary Service
          - **Purpose**: Generates AI-powered daily summaries from Slack messages and Jira issues
          - **Schedule**: Runs automatically at 11:00 PM IST daily
          - **Manual Trigger**: Available via `npm run test` or `npm run dev`

          ### Slack Service
          - **Integration**: Socket Mode for real-time communication
          - **Features**: Message fetching, thread analysis, user identification
          - **Configuration**: Requires SLACK_BOT_TOKEN and SLACK_APP_TOKEN

          ### Jira Service
          - **Integration**: REST API v3
          - **Features**: Issue fetching, project analysis, status tracking
          - **Configuration**: Requires JIRA_DOMAIN, JIRA_EMAIL, JIRA_API_TOKEN

          ### AI Service
          - **Provider**: Google Vertex AI
          - **Features**: Text generation, context analysis, summary creation
          - **Configuration**: Requires GOOGLE_APPLICATION_CREDENTIALS

          ## Environment Variables

          | Variable | Description | Required |
          |----------|-------------|----------|
          | SLACK_BOT_TOKEN | Slack Bot User OAuth Token | Yes |
          | SLACK_APP_TOKEN | Slack App Token | Yes |
          | SLACK_CHANNEL_ID | Target Slack Channel ID | Yes |
          | JIRA_DOMAIN | Jira Instance Domain | Yes |
          | JIRA_EMAIL | Jira User Email | Yes |
          | JIRA_API_TOKEN | Jira API Token | Yes |
          | JIRA_PROJECT_KEY | Jira Project Key | Yes |
          | GOOGLE_APPLICATION_CREDENTIALS | Google Cloud Credentials Path | Yes |
          | GOOGLE_VERTEX_PROJECT | Google Cloud Project ID | Yes |

          ## Usage Examples

          ### Manual Summary Generation
          ```bash
          npm run dev
          ```

          ### Test Jira Integration
          ```bash
          npm run test:jira
          ```

          ### Production Deployment
          ```bash
          npm run build
          npm start
          ```

          ## Error Handling
          The application includes comprehensive error handling for:
          - Slack API failures
          - Jira connectivity issues
          - AI service errors
          - Scheduling conflicts

          ## Monitoring
          - Console logging for all operations
          - Error tracking and reporting
          - Performance metrics collection
          EOF

      - name: Commit documentation updates
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/API.md
          git diff --staged --quiet || git commit -m "docs: update API documentation [skip ci]"
          git push
        continue-on-error: true
