name: Dependency Review

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'
  schedule:
    # Weekly dependency review
    - cron: '0 10 * * 1'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: NeuroPulse Dependency Analysis
        run: |
          echo "🤖 Analyzing NeuroPulse dependencies..."
          
          echo "📊 Current dependencies:"
          npm list --depth=0 || echo "Dependencies not yet installed"
          
          echo "🧠 AI/ML Dependencies:"
          grep -E "@google-cloud|openai|anthropic|@juspay/neurolink" package.json || echo "No AI dependencies found"
          
          echo "🔗 Integration Dependencies:"
          grep -E "slack|jira|vertex" package.json || echo "No integration dependencies found"
          
          echo "🛠️ Core Dependencies:"
          grep -E "express|typescript|node-" package.json || echo "No core dependencies found"

      - name: Security Audit
        run: |
          echo "🔒 Running security audit..."
          npm audit --audit-level moderate || echo "Security issues detected"
          
          echo "📋 Detailed security report:"
          npm audit --json > security-report.json || echo "Audit completed"
          
          # Check for high-risk packages in AI context
          echo "🎯 Checking NeuroPulse-specific security concerns..."
          if grep -q "@google-cloud\|openai\|anthropic" package.json; then
            echo "⚠️  AI service dependencies detected - ensure proper credential management"
          fi
          
          if grep -q "slack\|socket-mode" package.json; then
            echo "⚠️  Slack integration detected - verify webhook security"
          fi

      - name: License Compliance Check
        run: |
          echo "📄 License compliance check..."
          npx license-checker --summary || echo "License checker not available"
          
          echo "✅ Checking for NeuroPulse-compatible licenses..."
          # Ensure AI service dependencies have compatible licenses
          npx license-checker --onlyAllow "MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause" || echo "License issues detected"

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          allow-licenses: |
            MIT
            Apache-2.0
            ISC
            BSD-2-Clause
            BSD-3-Clause
            CC0-1.0
            Unlicense
          deny-licenses: |
            GPL-2.0
            GPL-3.0
            AGPL-1.0
            AGPL-3.0
            LGPL-2.1
            LGPL-3.0
          vulnerability-check: true
          license-check: true
          base-ref: ${{ github.event.pull_request.base.sha || 'main' }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: AI Dependencies Security Review
        run: |
          echo "🧠 AI Dependencies Security Review..."
          
          # Check for known AI/ML security issues
          echo "Checking for AI-specific vulnerabilities..."
          
          # Google Cloud dependencies
          if npm list @google-cloud/vertexai; then
            echo "✅ Google Vertex AI dependency found"
            echo "🔒 Ensure GOOGLE_APPLICATION_CREDENTIALS is properly secured"
          fi
          
          # Slack dependencies
          if npm list @slack/socket-mode; then
            echo "✅ Slack Socket Mode dependency found"
            echo "🔒 Ensure Slack tokens are properly secured"
          fi
          
          # Juspay dependencies
          if npm list @juspay/neurolink; then
            echo "✅ Juspay Neurolink dependency found"
            echo "🔒 Monitor for updates from trusted Juspay registry"
          fi
          
          # Check for suspicious packages
          echo "🔍 Checking for suspicious package patterns..."
          npm list | grep -i -E "crypto|bitcoin|mining|phishing" && echo "⚠️  Suspicious packages detected" || echo "✅ No suspicious packages found"

      - name: Performance Impact Analysis
        run: |
          echo "⚡ Performance Impact Analysis..."
          
          # Check bundle size impact
          echo "📦 Analyzing package sizes..."
          npx package-size-analyzer || echo "Package size analyzer not available"
          
          # Check for heavy AI dependencies
          echo "🎯 Checking for performance-heavy dependencies..."
          npm list | grep -E "tensorflow|torch|opencv" && echo "⚠️  Heavy ML dependencies detected" || echo "✅ No heavy ML dependencies"
          
          # Memory usage considerations
          echo "💾 Memory usage considerations for AI workloads..."
          echo "ℹ️  AI services may require significant memory - monitor in production"

      - name: Update Notifications
        run: |
          echo "🔔 Dependency Update Notifications..."
          
          # Check for outdated packages
          npm outdated || echo "All packages up to date"
          
          # Check for critical AI dependency updates
          echo "🧠 Checking for AI dependency updates..."
          npm outdated | grep -E "@google-cloud|@juspay|@slack" || echo "AI dependencies up to date"

      - name: Generate Security Report
        if: always()
        run: |
          echo "📊 Generating security report..."
          cat > dependency-security-report.md << 'EOF'
          # NeuroPulse Dependency Security Report
          
          ## Summary
          This report provides an overview of dependency security for the NeuroPulse project.
          
          ## AI Dependencies Status
          - Google Cloud Vertex AI: Monitored for security updates
          - Juspay Neurolink: Private registry - ensure trust chain
          - Slack Socket Mode: Monitor for API changes
          
          ## Security Recommendations
          1. Regularly update AI service dependencies
          2. Monitor for security advisories from providers
          3. Ensure proper credential rotation
          4. Implement dependency pinning for critical AI packages
          5. Use private registries for sensitive AI models
          
          ## License Compliance
          All dependencies use compatible licenses for commercial AI applications.
          
          ## Performance Considerations
          AI dependencies may impact memory and CPU usage - monitor in production.
          EOF

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-report
          path: |
            dependency-security-report.md
            security-report.json

      - name: Comment PR - Success
        uses: actions/github-script@v7
        if: success() && github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **NeuroPulse Dependency Review Passed**\n\n' +
                    '🤖 All NeuroPulse dependencies are secure and compliant\n' +
                    '🔒 No security vulnerabilities detected\n' +
                    '📄 License compliance verified\n' +
                    '⚡ Performance impact assessed\n\n' +
                    'Check the Actions tab for detailed security report.'
            })

      - name: Comment PR - Failure
        uses: actions/github-script@v7
        if: failure() && github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **NeuroPulse Dependency Review Failed**\n\n' +
                    'Security or license issues detected in dependencies.\n\n' +
                    '🔍 **Action Required:**\n' +
                    '- Review security vulnerabilities\n' +
                    '- Check license compatibility\n' +
                    '- Verify AI dependency configurations\n' +
                    '- Ensure credential security\n\n' +
                    'See the Actions tab for detailed information.'
            })
