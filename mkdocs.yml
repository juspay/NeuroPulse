# Extra CSS
extra_css:
  - stylesheets/extra.css
  - stylesheets/neuropulse.css

# Extra JavaScript
extra_javascript:
  - javascripts/config.js
  - javascripts/neuropulse.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Watch for changes
watch:
  - src/
  - docs/
  - memory-bank/
  - neurolink-demo/
